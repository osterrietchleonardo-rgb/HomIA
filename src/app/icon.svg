  <!-- Cabeza-cable: bucle casi circular -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 139 44 A 37 37 0 1 0 139 104" stroke="#102A45" stroke-width="17.5"/>
    <path d="M 139 44 A 37 37 0 1 0 139 104" stroke="url(#loop)" stroke-width="10.5"/>
    <path d="M 191 36 C 174 43 156 41 139 44" stroke="#102A45" stroke-width="17.5"/>
    <path d="M 191 36 C 174 43 156 41 139 44" stroke="url(#arm)" stroke-width="10.5"/>
  </g>

  <!-- Conector USB escalonado -->
  <g transform="translate(191 36) rotate(-8)">
    <rect x="-4" y="-12" width="20" height="24" rx="7" fill="#FFFFFF" stroke="#102A45" stroke-width="5.5"/>
    <rect x="1" y="-6" width="9" height="12" rx="3.5" fill="url(#collar)"/>
    <rect x="14" y="-15" width="26" height="30" rx="8" fill="url(#tip)" stroke="#102A45" stroke-width="5.5"/>
    <rect x="21" y="-8" width="13" height="16" rx="4" fill="#FFE3C8" opacity="0.95"/>
  </g>

  <!-- Cuerpo -->
  <path d="M 120 98 C 148 98 168 108 176 126 C 183 141 185 159 183 177 C 182 191 178 203 172 212 C 176 219 178 228 175 237 C 171 247 157 251 147 247 C 140 244 137 238 137 230 C 137 224 131 219 120 219 C 109 219 103 224 103 230 C 103 238 100 244 93 247 C 83 251 69 247 65 237 C 62 228 64 219 68 212 C 62 203 58 191 57 177 C 55 159 57 141 64 126 C 72 108 92 98 120 98 Z" fill="url(#body)" stroke="#102A45" stroke-width="7" stroke-linejoin="round"/>
  <ellipse cx="120" cy="230" rx="46" ry="15" fill="url(#shade)" opacity="0.55"/>

  <!-- Brazos -->
  <rect x="55" y="126" width="26" height="64" rx="13" transform="rotate(8 68 158)" fill="url(#body)" stroke="#102A45" stroke-width="6.5" stroke-linejoin="round"/>
  <rect x="159" y="126" width="26" height="64" rx="13" transform="rotate(-8 172 158)" fill="url(#body)" stroke="#102A45" stroke-width="6.5" stroke-linejoin="round"/>

  <!-- Orbe de pecho -->
  <circle cx="107" cy="141" r="23" fill="url(#glowC)"/>
  <circle cx="130" cy="162" r="28" fill="url(#glowW)"/>
  <circle cx="120" cy="152" r="13.5" fill="url(#orb)"/>
  <circle cx="132.5" cy="154" r="5" fill="#102A45" opacity="0.6" clip-path="url(#orbclip)"/>
  <ellipse cx="114.5" cy="146.5" rx="4" ry="3.6" fill="#FFFFFF" opacity="0.9"/>
</svg>
