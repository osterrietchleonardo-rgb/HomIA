<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 0 204 260" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E8EDF4"/>
    </linearGradient>
    <linearGradient id="loop" gradientUnits="userSpaceOnUse" x1="139" y1="110" x2="96" y2="32">
      <stop offset="0%" stop-color="#3E8BFF"/>
      <stop offset="20%" stop-color="#7BB6FF"/>
      <stop offset="48%" stop-color="#CFE6FF"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="arm" gradientUnits="userSpaceOnUse" x1="140" y1="44" x2="196" y2="34">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="38%" stop-color="#FFE9D2"/>
      <stop offset="68%" stop-color="#FFB061"/>
      <stop offset="100%" stop-color="#FF6A2A"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA14D"/>
      <stop offset="55%" stop-color="#FF5A1F"/>
      <stop offset="100%" stop-color="#EF4E3A"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ADFFF"/>
      <stop offset="100%" stop-color="#D9F3FF"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E8EF7"/>
      <stop offset="22%" stop-color="#A8D4FF"/>
      <stop offset="42%" stop-color="#EDF5FF"/>
      <stop offset="68%" stop-color="#FFC46B"/>
      <stop offset="85%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#F04E38"/>
    </linearGradient>
    <radialGradient id="glowW" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF8A4D" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#FF7A3D" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF7A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00C4FF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#00C4FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00C4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C4D2E4" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#C4D2E4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C4D2E4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="orbclip">
      <circle cx="120" cy="152" r="13.5"/>
    </clipPath>
